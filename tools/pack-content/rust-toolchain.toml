# Matches the engine repository's pin, so the one Rust program in this
# repository is built by the same compiler as the rest of the project.
#
# Kept beside the crate: it is the only Rust code in this repository, and
# rustup discovers this file by walking up from the working directory, so the
# workflow runs cargo from this directory rather than passing --manifest-path.
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
