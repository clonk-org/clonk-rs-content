[package]
name = "pack-content"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
ring = "0.17"
# Reads packs.toml: selected scopes, dependency checks and required notices.
toml = "1"
# The archive is content-addressed and these bytes are what encode it, so this
# pin is part of the content: moving it moves the digest and every install
# re-downloads the archive once. No feature set makes that free — zip 8 stamps
# version-made-by 20 where 0.6.6 stamped 46, and its `deflate` is flate2 over
# zlib-rs rather than miniz_oxide — so treat a bump here the way
# .github/dependabot.yml says to, as a content change whose digest was measured
# before it merged.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[[bin]]
name = "pack-content"
path = "src/main.rs"
