# Scenario-private definitions stay beside their consumers. Left packed, one
# file each: a packed group returns its stored header order, which is
# host-stable and is what C++ C4MaterialMap::Load consumes, where an unpacked
# directory would return unsorted readdir order.
nested_definitions = [
    "Adventures.c4f/InExantros.c4f/INEXSzenarioObjekte.c4d",
    "Adventures.c4f/InExantros.c4f/InExantros.C4D",
    "Fun.c4f/ClonkPartyRes.c4d",
    "Fun.c4f/ClonkPartyRes2.c4d",
    "Fun.c4f/GIDL_Race.c4d",
    "Fun.c4f/Zombieland.c4d",
    "Fun.c4f/Zombiesounds.c4d",
    "Hazard.c4f/Jetbelt.c4d",
    "Hazard.c4f/PhysGun.c4d",
    "Magus.c4f/Clonkrix-Remake.c4f/Clonkrix.c4d",
    "Magus.c4f/KdD_Magie_Pack.c4d",
    "ModernCombat.c4f/BlacksCMC-Waffenmod.c4d",
    "Puzzles.c4f/Explorer.c4d",
    "Races.c4f/Clinfinity.c4d",
    "Races.c4f/Ropepack.c4d",
    "Settling.c4f/RufDerWipfeRE.c4f/RufDerWipfe.c4d",
]

# Exploded into directories rather than left as single packed files: cargo
# xtask scenario-sweep walks the filesystem, so a packed .c4f hides every
# scenario inside it from the sweep.
[packs."Golems.c4f"]
origin = "ucc"
bytes = "preserve"
upstream_version = "4.95.5"
localization = ["clonk-org/clonk-rs-content#68"]

[packs."ModernCombat.c4f"]
origin = "ucc"
bytes = "preserve"
upstream_version = "R1.9"
localization = ["clonk-org/clonk-rs-content#73"]

# Definitions shared by separate scenario families, so they occupy the data
# root. Left packed, one file each.
[packs."Golems.c4d"]
origin = "ucc"
bytes = "preserve"

[packs."ModernCombat.c4d"]
origin = "ucc"
bytes = "preserve"

[packs."RopepackRemake.c4d"]
