# Every entry of the data root, described once.
#
# The repository root is the engine's data root (`General.ExePath` in classic
# terms), so each entry listed here is a directory or file a player receives.
# The policies below used to live in five places at once — the `binary` rules
# in .gitattributes, the skip list in set_version.sh, localization-pending.txt,
# the layout test and the README — and drifted between them. They are read from
# here by .github/packs.py, and `packs.py check` compares this file against the
# tracked tree and .gitattributes in the Validate job.
#
# Fields on a [packs."<path>"] table:
#
#   origin            which [origins.<name>] table the entry comes from; every
#                     entry must name one, so nothing ships without a recorded
#                     source and terms
#   bytes             "normalize" (default): Git applies the CRLF checkout rule
#                     "preserve": .gitattributes marks the entry binary so the
#                     imported bytes — and the group checksums a non-clonk-rs
#                     peer computes — never move; set_version.sh leaves its
#                     Version.txt alone
#   upstream_version  the exact bytes of a preserved pack's Version.txt, for
#                     the record and for the check
#   localization      issues tracking a known English-localization backlog;
#                     while any is listed, check_localizations.py skips the
#                     entry. Remove them as the linked work completes.
#   nested_definitions
#                     packed definition groups that live beside the scenarios
#                     that use them instead of at the data root; the layout
#                     test pins each one present there and absent from the root
#
# A path may reach inside a pack (`Melees.c4f/Queron3.c4s`) when a nested tree
# has its own origin and policy.

[origins.clonk-rs]
description = "This repository's own files."

[origins.legacyclonk]
source = "https://github.com/legacyclonk/content"
terms = "Creative Commons Attribution-NonCommercial, the grant those packs are published under; not the MIT licence that covers the engine source."

[origins.clonkmars]
source = "Classic third-party pack, ClonkMars 1.5 [Spirit]."
terms = "Included under separate, explicitly granted permission; not the CC BY-NC grant."

[origins.eke]
source = "Classic third-party pack, Eke Reloaded 1.7."
terms = "Included under separate, explicitly granted permission; not the CC BY-NC grant."

[origins.ccan]
source = "CCAN, the Clonk community archive."
terms = "Not the CC BY-NC grant. Establish the position for yourself before redistributing."

[origins.ucc]
source = "Newton's Ultimate Clonk Compilation v3.0, CCAN entry 6383, published 2025-03-14."
sha256 = "f6fce16b6bb4c9e150ba239876568a84187ab0c3e2ad45619d11fdb5e08214c3"
terms = "Its readme is explicit that the works remain the property of their individual authors; not the CC BY-NC grant."
ledger = "third_party/UltimateClonkCompilation"

[origins.epic]
source = "The maintainers' archived copy of E.P.I.C."
terms = "The payload credits Zagabar, Wertilq, Elwebbaro and its other contributors; see the ledger for hashes and complete credits."
ledger = "third_party/EPIC"

