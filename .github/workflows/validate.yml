name: Validate

# Runs on pull requests, so a change is exercised before it can publish.
#
# Until this existed, `publish-content.yml` was the first thing that ever ran
# against a change: it triggers on push to `main` and cuts a public release from
# whatever landed. A packaging failure was therefore discovered after the commit
# was already on `main` and already resolvable by an engine submodule pin.
#
# This job deliberately reproduces the publishing job's *build* phase and stops
# short of releasing. It does not share code with `publish-content.yml`: that
# workflow is documented as the single producer of the archive's bytes, and
# rewriting it to satisfy a validation requirement is a change to the release
# path rather than to the checks around it. The cost is that the two build
# blocks must be kept in step by hand; the size floor and the reproducibility
# assertion below are copied from it on purpose.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build content.zip and run repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run from the crate directory rather than with --manifest-path, so rustup
      # finds .github/pack-content/rust-toolchain.toml by walking up from here.
      #
      # `--locked` for the same reason the publishing job uses it: the archive's
      # bytes depend on the zip and deflate implementations the lockfile pins.
      - name: Build the packaging tool
        working-directory: .github/pack-content
        run: cargo build --release --locked

      # The packer's own tests. They cover what the archive's digest depends on
      # — entry order, the zip epoch, the fixed mode, prefix-freedom — and which
      # paths are game data. `cargo build` does not compile #[cfg(test)] code, so
      # before this step they had never run.
      - name: Test the packaging tool
        working-directory: .github/pack-content
        run: cargo test --locked

      - name: Lint the packaging tool
        working-directory: .github/pack-content
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # The packer refuses a worktree that differs from the index, so this also
      # catches a change that only exists as an uncommitted artifact.
      - name: Build content.zip and prove it is reproducible
        run: |
          packer=.github/pack-content/target/release/pack-content
          "$packer" first.zip
          "$packer" content.zip
          if ! cmp -s first.zip content.zip; then
            echo "two builds of the same tree produced different archives" >&2
            sha256sum first.zip content.zip >&2
            exit 1
          fi
          rm -f first.zip first.sha256

          # A floor, not a size check: it catches an empty container, which is
          # what a packaging bug most plausibly produces.
          size=$(wc -c < content.zip)
          if [[ "$size" -lt 150000000 ]]; then
            echo "content.zip is only $size bytes" >&2
            exit 1
          fi
          echo "ok content.zip $size bytes"
          cat content.sha256

      # The in-run `cmp` above proves the packer is deterministic within one
      # process on one machine. It cannot see the failure this repository
      # actually fears: the same tree producing a different digest in a later
      # run, on a different runner, after a dependency or compiler moved. That
      # would make every install re-download 253 MB with nothing changed, and
      # nothing would report it.
      #
      # So: when a branch changes nothing outside .github/, its archive must
      # still hash to whatever the base commit already published.
      #
      # `.github/` is a deliberately conservative test rather than a reading of
      # is_content_path. .gitignore and .gitattributes are outside it on purpose
      # — an eol rule changes checked-out bytes, and therefore the archive.
      - name: A branch that changes no content must not move the digest
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "no base commit (not a pull request); skipping"
            exit 0
          fi

          git fetch --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if [[ -z "$changed" ]]; then
            echo "no tracked files differ from the base; nothing to compare"
            exit 0
          fi

          # Two kinds of change legitimately move the digest: a file a client
          # receives, and the packer itself, which decides what goes in. The
          # packer never ships, so a path test alone would call a membership
          # change "no content changed" and fail an honest pull request.
          outside=$(grep -v '^\.github/' <<<"$changed" || true)
          packer=$(grep '^\.github/pack-content/' <<<"$changed" || true)
          if [[ -n "$outside" || -n "$packer" ]]; then
            echo "this branch changes what the archive contains:"
            printf '%s\n' "$outside" "$packer" | grep -v '^$' | sed 's/^/  /'
            echo "a different digest is expected; skipping the comparison"
            exit 0
          fi

          if ! gh release download "content-${BASE_SHA}" \
                 --repo "$GITHUB_REPOSITORY" --pattern content.sha256 \
                 --output base.sha256 2>/dev/null; then
            echo "content-${BASE_SHA} is not published yet; skipping" >&2
            exit 0
          fi

          want=$(cut -d' ' -f1 base.sha256)
          got=$(cut -d' ' -f1 content.sha256)
          if [[ "$want" != "$got" ]]; then
            echo "the archive digest moved without any content changing" >&2
            echo "  base ${BASE_SHA} published: $want" >&2
            echo "  this branch produced:       $got" >&2
            echo "every install would re-download the archive for nothing." >&2
            exit 1
          fi
          echo "ok digest unchanged from the base commit: $got"

      - name: set_version.sh leaves the third-party packs alone
        run: .github/tests/test_set_version.sh

      # Compares changed assets against their previous version rather than
      # auditing the tree: seven in-group files are already UTF-8 and fifteen
      # carry a stray trailing NUL, both pre-existing backlogs. This stops the
      # pile growing. Needs the base commit, which the digest step above fetches.
      - name: Game text assets keep their encoding
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "no base commit (not a pull request); skipping"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          python3 .github/tests/check_text_assets.py "$BASE_SHA"
