version: 2

# The packaging tool's dependencies and the actions the workflows pin.
#
# Both are pinned deliberately — `publish-content.yml` builds with `--locked`
# because content.zip's bytes depend on the zip and deflate implementations the
# lockfile names, and the workflows pin actions by commit SHA. Pinning without a
# way to move the pin is how a dependency quietly stops receiving fixes, so this
# supplies the moving part.
#
# A cargo bump here is not a routine merge: `zip` or `flate2` could encode the
# same files differently, which would change the archive's digest and make every
# install re-download it for nothing. Treat such a pull request as a content
# change and check the digest before merging.

updates:
  - package-ecosystem: cargo
    directory: /.github/pack-content
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      # Conventional Commits, no scope, matching the repository's history. The
      # subject becomes the squashed commit's subject on main.
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
